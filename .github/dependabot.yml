version: 2

# Dependabot only opens pull requests. CI decides what happens to them: the dependabot-auto-merge workflow arms
# GitHub auto-merge on every pull request Dependabot opens, so a green one merges itself and a red one stays open
# for the next dependency item of the current plan. npm majors are never opened (TypeScript 6 and @types/node 24 are
# pinned on purpose, msw is unused and awaits the dependency sweep; an agent item evaluates majors under the full
# gate list). Automated sessions never merge anything.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The majors below are pinned on purpose (UX plan D43). Each rule names its constraint, re-checked on
      # 2026-10-23 (UX-P0.4); the blanket rule above covers them too, these say why and keep them when it changes.
      # typescript-eslint 8.72.0 declares the peer typescript ">=4.8.4 <6.1.0" (npm view typescript-eslint
      # peerDependencies; latest typescript 7.0.2), so TypeScript 7 cannot be parsed.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # The toolchain and CI run Node 24 (.nvmrc); the types follow the runtime, not the newest major (latest 26.x).
      - dependency-name: "@types/node"
        versions: [">24"]
      # No peer pins msw: @vitest/mocker 5.0.x declares msw "^2.4.9 || ^3.0.0" (the plan's premise of an MSW 2 peer
      # no longer holds). msw has no importer, and a major of an unused development package is lock churn; the
      # dependency sweep (post-release) removes the package and this rule together.
      - dependency-name: "msw"
        versions: [">=3.0.0"]
      # Pinned to the engines.vscode minimum (1.90.0); a newer @types/vscode fails check:vsix and lets code use APIs
      # the supported hosts lack. Bumped only together with engines.vscode, by a plan item.
      - dependency-name: "@types/vscode"
      # npm alias of @types/node pinned exactly to a 20.x release for the host's Node 20.9 (ADR-000 names it and its
      # residual); re-pinned only together with engines.vscode, by a plan item. Whether Dependabot matches an npm alias is unverified; the rule is inert if it
      # does not.
      - dependency-name: "@types-host/node"
      # The icons are generated from one exact-pinned release (ADR-012); a release bump is its own plan item, which
      # regenerates the icons and re-checks the attribution. Every version is ignored; the rule may precede the
      # package, which a later plan item adds.
      - dependency-name: "@vscode/codicons"
      # The accessibility harness's ruleset (UX-P0.23): the ARIA snapshots, AXE_ACCEPTED, CONTRAST_PENDING and the
      # rule-coverage ledger are taken under axe-core 4.12.1, pinned exactly (UX-P0.fix-3). A bump is its own plan item,
      # which re-adopts the ARIA snapshots from a green run and regenerates axe-rule-coverage.json with
      # NUIGET_AXE_COVERAGE_WRITE=1. A later jest-axe re-pin nests its own copy under node_modules/jest-axe/node_modules/
      # while the harness keeps this one.
      - dependency-name: "axe-core"
