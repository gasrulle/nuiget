name: CI

on:
  push:
    branches: [ main, "labs/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SDK-dependent tests run only where a .NET 10 SDK is guaranteed (plan §2.6).
  NUIGET_SDK_TESTS: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    # Explicit bash gives `-eo pipefail` on every runner, so `command | tee log` fails when the command fails,
    # and the summary scripts also run on Windows.
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: |
          set +e
          npm run lint -- --format json -o eslint-report.json
          LINT_EXIT=$?

          ERRORS=$(node -p "require('./eslint-report.json').reduce((s,f)=>s+f.errorCount,0)")
          WARNINGS=$(node -p "require('./eslint-report.json').reduce((s,f)=>s+f.warningCount,0)")

          {
            echo "## 🔍 Lint Results"
            echo ""
            if [ "$ERRORS" -eq 0 ] && [ "$WARNINGS" -eq 0 ]; then
              echo "✅ **Clean** — no errors or warnings"
            else
              echo "| Metric | Count |"
              echo "|--------|------:|"
              echo "| ❌ Errors | $ERRORS |"
              echo "| ⚠️ Warnings | $WARNINGS |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERRORS" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
            npm run lint || true
          fi

          exit $LINT_EXIT

      - name: Test the Claude Code guard hook
        run: node --test scripts/hooks

      # docs/protocol.md is generated from src/protocol/messages.ts (ADR-007); this fails when it has drifted.
      - name: Check the protocol reference
        run: npm run docs:protocol:check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet --version

      - run: npm ci --no-audit --no-fund

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: npx vitest run --coverage

      - name: Run tests
        if: runner.os != 'Linux'
        run: npm test

      - name: Add coverage to summary
        if: always() && runner.os == 'Linux'
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
            BRANCHES=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct")
            FUNCTIONS=$(node -p "require('./coverage/coverage-summary.json').total.functions.pct")
            STATEMENTS=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage | Threshold |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% | 65% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% | 50% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCTIONS}% | 55% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STATEMENTS}% | 65% |" >> $GITHUB_STEP_SUMMARY
          fi

  e2e:
    name: E2E (${{ matrix.vscode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported VS Code (engines.vscode) and current stable.
        vscode: [ '1.85.0', 'stable' ]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      # The first legacy e2e test waits a fixed 10 s for the suite's first dotnet command (finding N44).
      - name: Warm up dotnet
        run: dotnet --version && dotnet msbuild -version

      - run: npm ci --no-audit --no-fund

      - name: Build extension
        run: node esbuild.mjs --production

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e 2>&1 | tee e2e-output.txt

      - name: Add E2E summary
        if: always()
        run: |
          {
            echo "## 🧪 E2E Test Results (VS Code $VSCODE_TEST_VERSION)"
            echo ""
            if [ -f e2e-output.txt ]; then
              CLEAN=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' e2e-output.txt)
              PASSING=$(echo "$CLEAN" | grep -oP '\d+(?= passing)' | tail -1 || true)
              FAILING=$(echo "$CLEAN" | grep -oP '\d+(?= failing)' | tail -1 || true)
              PENDING=$(echo "$CLEAN" | grep -oP '\d+(?= pending)' | tail -1 || true)
              PASSING=${PASSING:-0}
              FAILING=${FAILING:-0}
              PENDING=${PENDING:-0}
              if [ "$PASSING" = "0" ] && [ "$FAILING" = "0" ]; then
                echo "⚠️ Could not parse test results from output"
              else
                echo "| Metric | Count |"
                echo "|--------|------:|"
                echo "| ✅ Passing | $PASSING |"
                if [ "$FAILING" != "0" ]; then
                  echo "| ❌ Failing | $FAILING |"
                fi
                if [ "$PENDING" != "0" ]; then
                  echo "| ⏭️ Pending | $PENDING |"
                fi
              fi
            else
              echo "⚠️ No test output captured"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-log-${{ matrix.vscode }}
          path: e2e-output.txt
          if-no-files-found: ignore

  ui:
    name: UI
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - run: npm ci --no-audit --no-fund

      # A short storage path keeps the VS Code IPC socket under the Unix path limit.
      - name: Run UI tests
        run: xvfb-run -a npm run test:ui -- --storage /tmp/nuiget-ui 2>&1 | tee ui-output.txt

      - name: Upload UI log and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-log
          path: |
            ui-output.txt
            /tmp/nuiget-ui/screenshots
          if-no-files-found: ignore

  build:
    name: Build & Package
    needs: [ lint, test, e2e ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check-types

      - name: Build extension
        run: node esbuild.mjs --production

      - name: Check VSIX contents
        run: npm run check:vsix

      - name: Package VSIX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx vsce package --out "nuiget-v${VERSION}.vsix"

      - name: Add build info to summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## 📦 VSIX Artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**nuiget-v${VERSION}.vsix** — download it from this run's artifacts; the owner publishes it manually" >> $GITHUB_STEP_SUMMARY

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: nuiget-v*.vsix
          if-no-files-found: error

  benchmark:
    # Informational (plan D8): reports on every run, never blocks the build.
    name: Benchmark (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run benchmarks against baseline
        run: npm run bench:compare

      - name: Add benchmark summary
        if: always()
        run: |
          {
            echo "## ⚡ Benchmark Results"
            echo ""
            if [ -f benchmarks/latest.json ]; then
              node -e "
                const d = require('./benchmarks/latest.json');
                const files = d.testResults.filter(f => f.assertionResults.some(a => a.benchmarks.length)).length;
                const groups = new Set(d.testResults.flatMap(f =>
                  f.assertionResults.filter(a => a.benchmarks.length).map(a =>
                    JSON.stringify([f.name, a.ancestorTitles])))).size;
                const benches = d.testResults.reduce((s, f) => s + f.assertionResults.reduce((n, a) =>
                  n + a.benchmarks.reduce((g, b) => g + b.tasks.filter(t => !t.fromStore).length, 0), 0), 0);
                console.log('| Metric | Count |');
                console.log('|--------|------:|');
                console.log('| Benchmark files | ' + files + ' |');
                console.log('| Benchmark groups | ' + groups + ' |');
                console.log('| Total benchmarks | ' + benches + ' |');
              "
              echo ""
              echo "Compared against committed \`benchmarks/baseline.json\`."
              echo "To update the baseline: \`npm run bench:save\` and commit."
            else
              echo "⚠️ No benchmark output generated"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
