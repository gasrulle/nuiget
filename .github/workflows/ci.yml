name: CI

on:
  push:
    branches: [main, "labs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run ESLint
        run: |
          set +e
          npx eslint src --format json -o eslint-report.json
          LINT_EXIT=$?

          ERRORS=$(node -p "require('./eslint-report.json').reduce((s,f)=>s+f.errorCount,0)")
          WARNINGS=$(node -p "require('./eslint-report.json').reduce((s,f)=>s+f.warningCount,0)")

          {
            echo "## 🔍 Lint Results"
            echo ""
            if [ "$ERRORS" -eq 0 ] && [ "$WARNINGS" -eq 0 ]; then
              echo "✅ **Clean** — no errors or warnings"
            else
              echo "| Metric | Count |"
              echo "|--------|------:|"
              echo "| ❌ Errors | $ERRORS |"
              echo "| ⚠️ Warnings | $WARNINGS |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERRORS" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
            npx eslint src || true
          fi

          exit $LINT_EXIT

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Add coverage to summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
            BRANCHES=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct")
            FUNCTIONS=$(node -p "require('./coverage/coverage-summary.json').total.functions.pct")
            STATEMENTS=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage | Threshold |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% | 65% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% | 50% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCTIONS}% | 55% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STATEMENTS}% | 65% |" >> $GITHUB_STEP_SUMMARY
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build extension
        run: node esbuild.mjs --production

      - name: Compile E2E tests
        run: npx tsc -p tsconfig.test.json

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e 2>&1 | tee e2e-output.txt

      - name: Add E2E summary
        if: always()
        run: |
          {
            echo "## 🧪 E2E Test Results"
            echo ""
            if [ -f e2e-output.txt ]; then
              CLEAN=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' e2e-output.txt)
              PASSING=$(echo "$CLEAN" | grep -oP '\d+(?= passing)' | tail -1)
              FAILING=$(echo "$CLEAN" | grep -oP '\d+(?= failing)' | tail -1)
              PENDING=$(echo "$CLEAN" | grep -oP '\d+(?= pending)' | tail -1)
              PASSING=${PASSING:-0}
              FAILING=${FAILING:-0}
              PENDING=${PENDING:-0}
              if [ "$PASSING" = "0" ] && [ "$FAILING" = "0" ]; then
                echo "⚠️ Could not parse test results from output"
              else
                echo "| Metric | Count |"
                echo "|--------|------:|"
                echo "| ✅ Passing | $PASSING |"
                if [ "$FAILING" != "0" ]; then
                  echo "| ❌ Failing | $FAILING |"
                fi
                if [ "$PENDING" != "0" ]; then
                  echo "| ⏭️ Pending | $PENDING |"
                fi
              fi
            else
              echo "⚠️ No test output captured"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Package
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Build extension
        run: node esbuild.mjs --production

      - name: Package VSIX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx vsce package --out "nuiget-v${VERSION}.vsix"

      - name: Add build info to summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## 📦 VSIX Artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**nuiget-v${VERSION}.vsix** — ready to publish" >> $GITHUB_STEP_SUMMARY

  benchmark:
    name: Benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run benchmarks against baseline
        run: npx vitest bench --run --project backend --compare benchmarks/baseline.json --outputJson benchmarks/latest.json

      - name: Add benchmark summary
        if: always()
        run: |
          {
            echo "## ⚡ Benchmark Results"
            echo ""
            if [ -f benchmarks/latest.json ]; then
              node -e "
                const d = require('./benchmarks/latest.json');
                const files = d.files.length;
                const groups = d.files.reduce((s, f) => s + f.groups.length, 0);
                const benches = d.files.reduce((s, f) => s + f.groups.reduce((gs, g) => gs + g.benchmarks.length, 0), 0);
                console.log('| Metric | Count |');
                console.log('|--------|------:|');
                console.log('| Benchmark files | ' + files + ' |');
                console.log('| Benchmark groups | ' + groups + ' |');
                console.log('| Total benchmarks | ' + benches + ' |');
              "
              echo ""
              echo "Compared against committed \`benchmarks/baseline.json\`."
              echo "To update the baseline: \`npm run bench:save\` and commit."
            else
              echo "⚠️ No benchmark output generated"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
