name: CI

on:
  push:
    branches: [ main, "labs/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      # B adds the Tier B matrix, the VS Code 1.90.0 floor lane and the macOS lane (UX-P0.9; RUN-ux §6 at phase gates).
      tier:
        description: 'A: the per-push jobs only. B: also ui-matrix, ui-floor and ui-macos.'
        type: choice
        options: [ 'A', 'B' ]
        default: 'A'
      # Read by the negative-control job (UX-P0.16).
      negative_sha:
        description: 'A commit whose VSIX the harness of HEAD measures (negative control).'
        type: string
        default: ''

concurrency:
  # A dispatch and a push of the same ref do not cancel each other.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SDK-dependent tests run only where a .NET 10 SDK is guaranteed (plan §2.6).
  NUIGET_SDK_TESTS: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    # Explicit bash gives `-eo pipefail` on every runner, so `command | tee log` fails when the command fails,
    # and the summary scripts also run on Windows.
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: |
          set +e
          npm run lint -- --format json -o eslint-report.json
          LINT_EXIT=$?

          ERRORS=$(node -p "require('./eslint-report.json').reduce((s,f)=>s+f.errorCount,0)")
          WARNINGS=$(node -p "require('./eslint-report.json').reduce((s,f)=>s+f.warningCount,0)")

          {
            echo "## 🔍 Lint Results"
            echo ""
            if [ "$ERRORS" -eq 0 ] && [ "$WARNINGS" -eq 0 ]; then
              echo "✅ **Clean** — no errors or warnings"
            else
              echo "| Metric | Count |"
              echo "|--------|------:|"
              echo "| ❌ Errors | $ERRORS |"
              echo "| ⚠️ Warnings | $WARNINGS |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERRORS" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
            npm run lint || true
          fi

          exit $LINT_EXIT

      - name: Test the Claude Code guard hook
        run: node --test scripts/hooks

      # The 2.0 documents name only messages, settings, commands and paths that exist (scripts/check-docs-drift.mjs),
      # and docs/protocol.md, generated from src/protocol/messages.ts (ADR-007), has not drifted; the regression matrix
      # cites tests that exist (scripts/check-regression-matrix.mjs, plan item P10.0a).
      - name: Check the docs
        run: npm run docs:check && npm run check:matrix

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet --version

      - run: npm ci --no-audit --no-fund

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: npx vitest run --coverage

      - name: Run tests
        if: runner.os != 'Linux'
        run: npm test

      - name: Add coverage to summary
        if: always() && runner.os == 'Linux'
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
            BRANCHES=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct")
            FUNCTIONS=$(node -p "require('./coverage/coverage-summary.json').total.functions.pct")
            STATEMENTS=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage | Threshold |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% | 90% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% | 80% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCTIONS}% | 85% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STATEMENTS}% | 90% |" >> $GITHUB_STEP_SUMMARY
          fi

  # Re-runs the CPM probe of src/core/cli/__fixtures__/sdk-probes on the newest SDK 10 and fails when its exit codes,
  # file diffs, evaluations or verdict differ from the tracked fixture (plan P6.1, ADR-004). A red run means the SDK
  # changed what `dotnet package add` does to a CPM project: the uploaded probe is the evidence for that decision.
  sdk-probe:
    name: SDK probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet --version

      - name: Probe the SDK and compare with the tracked fixture
        run: node scripts/probe-sdk.mjs --check --out sdk-probe.json

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-probe
          path: sdk-probe.json
          if-no-files-found: ignore

  # The extension host suites (`v2-*`, selected by .vscode-test.mjs; plan items P3.5 and P8.1).
  e2e:
    name: E2E (${{ matrix.vscode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported VS Code (engines.vscode, the only Node 20.9 host that runs 2.0 code) and current stable.
        vscode: [ '1.90.0', 'stable' ]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Warm up dotnet
        run: dotnet --version && dotnet msbuild -version

      - run: npm ci --no-audit --no-fund

      # The analysis checks the bundle ceilings of esbuild.mjs; the three size lines go to the job summary.
      - name: Build extension
        run: |
          node esbuild.mjs --production --analyze 2>&1 | tee "$RUNNER_TEMP/esbuild.txt"
          grep -E '^dist/.*\.js [0-9]+ / [0-9]+' "$RUNNER_TEMP/esbuild.txt" >> "$GITHUB_STEP_SUMMARY"

      # One retry when no test ran (findings N37, N65: VS Code or ChromeDriver failed to download, or the window hung
      # before Mocha started). A log with a passing or failing count is never retried; the first attempt stays in it.
      - name: Run E2E tests
        run: |
          set +e
          xvfb-run -a npm run test:e2e 2>&1 | tee e2e-output.txt
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ] && ! grep -qE '[0-9]+ (passing|failing)' e2e-output.txt; then
            echo "::warning::No test ran (N37/N65); one retry"
            echo "=== retry (N37/N65) ===" >> e2e-output.txt
            xvfb-run -a npm run test:e2e 2>&1 | tee -a e2e-output.txt
            STATUS=${PIPESTATUS[0]}
          fi
          exit $STATUS

      - name: Add E2E summary
        if: always()
        run: |
          {
            echo "## 🧪 E2E Test Results (VS Code $VSCODE_TEST_VERSION)"
            echo ""
            if [ -f e2e-output.txt ]; then
              CLEAN=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' e2e-output.txt)
              PASSING=$(echo "$CLEAN" | grep -oP '\d+(?= passing)' | tail -1 || true)
              FAILING=$(echo "$CLEAN" | grep -oP '\d+(?= failing)' | tail -1 || true)
              PENDING=$(echo "$CLEAN" | grep -oP '\d+(?= pending)' | tail -1 || true)
              PASSING=${PASSING:-0}
              FAILING=${FAILING:-0}
              PENDING=${PENDING:-0}
              if [ "$PASSING" = "0" ] && [ "$FAILING" = "0" ]; then
                echo "⚠️ Could not parse test results from output"
              else
                echo "| Metric | Count |"
                echo "|--------|------:|"
                echo "| ✅ Passing | $PASSING |"
                if [ "$FAILING" != "0" ]; then
                  echo "| ❌ Failing | $FAILING |"
                fi
                if [ "$PENDING" != "0" ]; then
                  echo "| ⏭️ Pending | $PENDING |"
                fi
              fi
            else
              echo "⚠️ No test output captured"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-log-${{ matrix.vscode }}
          path: e2e-output.txt
          if-no-files-found: ignore

  # The webviews through WebDriver, on a VSIX that ExTester packages: its vscode:prepublish builds the entries.
  # check:vsix then checks what that build put into dist/.
  ui:
    name: UI
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # SDK 10 for the product, and the exact SDK that the dense workspace's Unsupported project pins in its
      # global.json (never 8.0.x: a different patch would not resolve, and the project would read as supported).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.425

      - run: npm ci --no-audit --no-fund

      - name: Cache the dense workspace's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-dense-${{ runner.os }}-${{ hashFiles('src/test/ui/fixtures/dense-workspace/**/*.csproj', 'src/test/ui/fixtures/dense-workspace/**/*.props', 'src/test/ui/fixtures/dense-workspace/**/global.json', 'src/test/ui/fixtures/dense-workspace/nuget.config') }}

      # The capture states read the restored projects. Unsupported restores from its own directory, so its global.json
      # selects SDK 8.0.425 as it does for the extension.
      - name: Restore the dense workspace
        working-directory: src/test/ui/fixtures/dense-workspace
        run: |
          dotnet restore app/Gateway/Gateway.csproj
          dotnet restore app/Catalog/Catalog.csproj
          dotnet restore tools/Utility/Utility.csproj
          (cd tools/Unsupported && dotnet restore Unsupported.csproj)

      # A failed SDK resolution would make the Unsupported project read as supported, and its states would pass.
      - name: Check that the Unsupported project resolves SDK 8.0.425
        working-directory: src/test/ui/fixtures/dense-workspace/tools/Unsupported
        run: |
          version=$(dotnet --version)
          echo "Unsupported resolves .NET SDK $version"
          test "$version" = "8.0.425"

      # The VS Code that test:ui pins (--code_version), unpacked into the storage folder; ExTester skips the download
      # when the folder holds that version.
      - name: Cache the VS Code of the UI tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nuiget-ui/VSCode-linux-x64
          key: extester-vscode-1.140.0-${{ runner.os }}

      # The v2 suites on the e2e workspace, then the capture suite of the named states on the dense workspace
      # (test:ui:capture). The scripts carry --storage /tmp/nuiget-ui (a short path keeps the VS Code IPC socket under
      # the Unix limit) and --extensions_dir under it. The 1920x1080 screen lets VS Code open its default window at
      # 1440 px (clamped to 1280 on xvfb's default screen), inside which the side bar's sash reaches a 1200 px panel
      # with the side bar above its 170 px minimum; the suite never sets the window size (ChromeDriver cannot on
      # Electron, H77). The log is written outside the checkout: vsce packages the working directory, and check:vsix
      # below refuses any file it does not allow.
      - name: Run UI tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:ui 2>&1 | tee "$RUNNER_TEMP/ui-output.txt"

      # The classic look's pass of the theme-sensitive states (settings.classic.json, NUIGET_UI_LOOK=classic).
      - name: Capture the classic look
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:ui:classic 2>&1 | tee "$RUNNER_TEMP/ui-classic-output.txt"

      # The pixel diff of every crop against its golden in src/test/ui/v2/golden (UX-P0.15): one [diff] line per crop,
      # the diff image of a crop that differs under diff/ in the screenshots artifact. Informational: the script exits 0.
      - name: Compare the crops with their goldens
        if: always()
        run: node scripts/compare-goldens.mjs /tmp/nuiget-ui/screenshots --diff /tmp/nuiget-ui/screenshots/diff 2>&1 | tee "$RUNNER_TEMP/ui-diff.txt"

      - name: Check VSIX contents
        run: npm run check:vsix

      - name: Upload UI log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-log
          path: |
            ${{ runner.temp }}/ui-output.txt
            ${{ runner.temp }}/ui-classic-output.txt
            ${{ runner.temp }}/ui-diff.txt
          if-no-files-found: ignore

      # The webview crops of the named states at the root (<state>.<theme>.<width>.png, UX-P0.8) with their sidecars
      # (<state>.<theme>.<width>.json, UX-P0.15), the pixel diff's images under diff/, the window PNGs of the v2 suites
      # and of the capture runs under <run timestamp>/, and ExTester's screenshots of failed tests.
      # Uploaded on success too. No screenshot at all is a failure of this step.
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: /tmp/nuiget-ui/screenshots
          if-no-files-found: error

      # The one list of named states, src/test/ui/v2/states.ts (compiled by test:ui): every capture of a ready state is
      # a crop at the root, no file exists for a pending state, and every state of the 2.0 set still has its window PNG
      # under a timestamp folder, so none is dropped.
      - name: Check the named screenshots
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { LEGACY_STATES, expectedFiles, screenshotProblems } = require("./out/test/ui/v2/states.js");
            const root = "/tmp/nuiget-ui/screenshots";
            const entries = fs.readdirSync(root, { withFileTypes: true });
            const crops = entries.filter(entry => entry.isFile() && entry.name.endsWith(".png")).map(entry => entry.name);
            const windows = entries.filter(entry => entry.isDirectory()).flatMap(entry => fs.readdirSync(path.join(root, entry.name)));
            const problems = screenshotProblems(crops, windows);
            for (const problem of problems) console.log("::error::" + problem);
            console.log(expectedFiles().length + " captures expected, " + crops.length + " crops at the root, " + LEGACY_STATES.length + " states of the 2.0 set");
            process.exit(problems.length === 0 && LEGACY_STATES.length >= 15 ? 0 : 1);'

  # Tier B (UX-P0.9, dispatch with tier=B): every ready named state at the three widths of its surface, one shard per
  # theme, Modern UI. Under a window manager inside xvfb-run, ExTester's window.newWindowDimensions: maximized default takes the
  # 1920x1080 screen, so a 1600 px panel fits beside the side bar (the fullscreen key left the window at 1448 px in run
  # 39992434105); the per-push ui job keeps VS Code's own 1440x900 window.
  ui-matrix:
    name: UI matrix (${{ matrix.theme }})
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'B'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        theme: [ dark-modern, light-modern, dark-high-contrast, light-high-contrast, dark-2026, light-2026 ]
    env:
      NUIGET_UI_LANE: matrix
      NUIGET_UI_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.425

      - run: npm ci --no-audit --no-fund

      - name: Install a window manager
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fluxbox

      - name: Cache the dense workspace's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-dense-${{ runner.os }}-${{ hashFiles('src/test/ui/fixtures/dense-workspace/**/*.csproj', 'src/test/ui/fixtures/dense-workspace/**/*.props', 'src/test/ui/fixtures/dense-workspace/**/global.json', 'src/test/ui/fixtures/dense-workspace/nuget.config') }}

      - name: Restore the dense workspace
        working-directory: src/test/ui/fixtures/dense-workspace
        run: |
          dotnet restore app/Gateway/Gateway.csproj
          dotnet restore app/Catalog/Catalog.csproj
          dotnet restore tools/Utility/Utility.csproj
          (cd tools/Unsupported && dotnet restore Unsupported.csproj)

      - name: Check that the Unsupported project resolves SDK 8.0.425
        working-directory: src/test/ui/fixtures/dense-workspace/tools/Unsupported
        run: test "$(dotnet --version)" = "8.0.425"

      - name: Cache the VS Code of the UI tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nuiget-ui/VSCode-linux-x64
          key: extester-vscode-1.140.0-${{ runner.os }}

      - name: Capture the Tier B shard
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'fluxbox >/dev/null 2>&1 & sleep 2; npm run test:ui:matrix' 2>&1 | tee "$RUNNER_TEMP/ui-output.txt"

      - name: Upload the shard's log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-log-${{ matrix.theme }}
          path: ${{ runner.temp }}/ui-output.txt
          if-no-files-found: ignore

      - name: Upload the shard's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots-${{ matrix.theme }}
          path: /tmp/nuiget-ui/screenshots
          if-no-files-found: error

      - name: Check the shard's captures
        run: |
          node -e '
            const fs = require("fs");
            const { laneFiles, laneProblems } = require("./out/test/ui/v2/states.js");
            const lane = process.env.NUIGET_UI_LANE;
            const theme = process.env.NUIGET_UI_THEME || undefined;
            const crops = fs.readdirSync("/tmp/nuiget-ui/screenshots", { withFileTypes: true }).filter(entry => entry.isFile() && entry.name.endsWith(".png")).map(entry => entry.name);
            const problems = laneProblems(crops, lane, theme);
            for (const problem of problems) console.log("::error::" + problem);
            console.log(laneFiles(lane, theme).length + " captures expected, " + crops.length + " crops at the root");
            process.exit(problems.length === 0 ? 0 : 1);'

  # The floor (UX-P0.9, D55, closes N64): VS Code 1.90.0, Chromium 122, outside ExTester's declared range (a warning);
  # it has no Modern UI, so every Tier A (theme, width) is captured in the classic look. Maximized under fluxbox, as the
  # matrix: VS Code 1.90 opens a 1024x768 window by itself.
  ui-floor:
    name: UI floor (1.90.0)
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'B'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUIGET_UI_LANE: floor
      NUIGET_UI_LOOK: classic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.425

      - run: npm ci --no-audit --no-fund

      - name: Install a window manager
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fluxbox

      - name: Cache the dense workspace's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-dense-${{ runner.os }}-${{ hashFiles('src/test/ui/fixtures/dense-workspace/**/*.csproj', 'src/test/ui/fixtures/dense-workspace/**/*.props', 'src/test/ui/fixtures/dense-workspace/**/global.json', 'src/test/ui/fixtures/dense-workspace/nuget.config') }}

      - name: Restore the dense workspace
        working-directory: src/test/ui/fixtures/dense-workspace
        run: |
          dotnet restore app/Gateway/Gateway.csproj
          dotnet restore app/Catalog/Catalog.csproj
          dotnet restore tools/Utility/Utility.csproj
          (cd tools/Unsupported && dotnet restore Unsupported.csproj)

      - name: Check that the Unsupported project resolves SDK 8.0.425
        working-directory: src/test/ui/fixtures/dense-workspace/tools/Unsupported
        run: test "$(dotnet --version)" = "8.0.425"

      - name: Cache the VS Code of the floor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nuiget-ui/VSCode-linux-x64
          key: extester-vscode-1.90.0-${{ runner.os }}

      - name: Capture the floor
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'fluxbox >/dev/null 2>&1 & sleep 2; npm run test:ui:floor' 2>&1 | tee "$RUNNER_TEMP/ui-output.txt"

      - name: Upload the floor's log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-log-floor
          path: ${{ runner.temp }}/ui-output.txt
          if-no-files-found: ignore

      - name: Upload the floor's screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots-floor
          path: /tmp/nuiget-ui/screenshots
          if-no-files-found: error

      - name: Check the floor's captures
        run: |
          node -e '
            const fs = require("fs");
            const { laneFiles, laneProblems } = require("./out/test/ui/v2/states.js");
            const lane = process.env.NUIGET_UI_LANE;
            const theme = process.env.NUIGET_UI_THEME || undefined;
            const crops = fs.readdirSync("/tmp/nuiget-ui/screenshots", { withFileTypes: true }).filter(entry => entry.isFile() && entry.name.endsWith(".png")).map(entry => entry.name);
            const problems = laneProblems(crops, lane, theme);
            for (const problem of problems) console.log("::error::" + problem);
            console.log(laneFiles(lane, theme).length + " captures expected, " + crops.length + " crops at the root");
            process.exit(problems.length === 0 ? 0 : 1);'

  # macOS (UX-P0.9): the Tier A capture suite, both looks, on a real window manager; captures and measurements, never
  # goldens (plan §2.6). It runs on the free standard Intel runner and sets the display to 1440x900 (the per-push ui
  # job's window) before the run: macos-latest (arm64) has a 1024x768 display and refuses Anka's resolution call
  # (dispatch 39998544491), and macos-latest-large never started (dispatch 40011268413); the owner withdrew paid minutes
  # on 2026-10-23.
  ui-macos:
    name: UI macOS
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'B'
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      NUIGET_UI_LANE: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A probe: the first mechanism the image has, then the resolution again. It never fails the job; the capture
      # step's [capture] lane header is the evidence.
      - name: Set the display to 1440x900 (probe, UX-P0.9)
        run: |
          system_profiler SPDisplaysDataType | grep -i resolution || true
          anka="/Library/Application Support/Veertu/Anka/addons/change_res"
          vmware="/Library/Application Support/VMware Tools/vmware-resolutionSet"
          if [ -x "$anka" ]; then
            echo "mechanism: Anka change_res"
            "$anka" 1440x900x32@30 || true
          elif [ -x "$vmware" ]; then
            echo "mechanism: VMware vmware-resolutionSet"
            "$vmware" 1440 900 || true
          elif brew install displayplacer >/dev/null 2>&1 && displayplacer list | grep -q 'res:1440x900'; then
            screen=$(displayplacer list | sed -n 's/^Persistent screen id: //p' | head -1)
            echo "mechanism: displayplacer on screen $screen"
            displayplacer "id:$screen res:1440x900" || true
          else
            echo "no display mechanism on this image"
          fi
          sleep 2
          system_profiler SPDisplaysDataType | grep -i resolution || true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.425

      - run: npm ci --no-audit --no-fund

      - name: Cache the dense workspace's packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-dense-${{ runner.os }}-${{ hashFiles('src/test/ui/fixtures/dense-workspace/**/*.csproj', 'src/test/ui/fixtures/dense-workspace/**/*.props', 'src/test/ui/fixtures/dense-workspace/**/global.json', 'src/test/ui/fixtures/dense-workspace/nuget.config') }}

      - name: Restore the dense workspace
        working-directory: src/test/ui/fixtures/dense-workspace
        run: |
          dotnet restore app/Gateway/Gateway.csproj
          dotnet restore app/Catalog/Catalog.csproj
          dotnet restore tools/Utility/Utility.csproj
          (cd tools/Unsupported && dotnet restore Unsupported.csproj)

      - name: Check that the Unsupported project resolves SDK 8.0.425
        working-directory: src/test/ui/fixtures/dense-workspace/tools/Unsupported
        run: test "$(dotnet --version)" = "8.0.425"

      - name: Cache the VS Code of the UI tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nuiget-ui/Visual Studio Code.app
          key: extester-vscode-1.140.0-${{ runner.os }}-${{ runner.arch }}

      - name: Capture Tier A on macOS
        run: npm run test:ui:macos 2>&1 | tee "$RUNNER_TEMP/ui-output.txt"

      - name: Upload the macOS log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-log-macos
          path: ${{ runner.temp }}/ui-output.txt
          if-no-files-found: ignore

      - name: Upload the macOS screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots-macos
          path: /tmp/nuiget-ui/screenshots
          if-no-files-found: error

      - name: Check the macOS captures
        run: |
          node -e '
            const fs = require("fs");
            const { laneFiles, laneProblems } = require("./out/test/ui/v2/states.js");
            const lane = process.env.NUIGET_UI_LANE;
            const theme = process.env.NUIGET_UI_THEME || undefined;
            const crops = fs.readdirSync("/tmp/nuiget-ui/screenshots", { withFileTypes: true }).filter(entry => entry.isFile() && entry.name.endsWith(".png")).map(entry => entry.name);
            const problems = laneProblems(crops, lane, theme);
            for (const problem of problems) console.log("::error::" + problem);
            console.log(laneFiles(lane, theme).length + " captures expected, " + crops.length + " crops at the root");
            process.exit(problems.length === 0 ? 0 : 1);'

  build:
    name: Build & Package
    needs: [ lint, test, e2e ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check-types

      # The analysis checks the bundle ceilings of esbuild.mjs; its metafiles go to out/, which the VSIX excludes.
      - name: Build extension
        run: node esbuild.mjs --production --analyze

      - name: Check VSIX contents
        run: npm run check:vsix

      - name: Package VSIX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx vsce package --out "nuiget-v${VERSION}.vsix"

      - name: Add build info to summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## 📦 VSIX Artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**nuiget-v${VERSION}.vsix** — download it from this run's artifacts; the owner publishes it manually" >> $GITHUB_STEP_SUMMARY

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: nuiget-v*.vsix
          if-no-files-found: error

  benchmark:
    # Informational (plan D8): reports on every run, never blocks the build.
    name: Benchmark (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run benchmarks against baseline
        run: npm run bench:compare

      - name: Add benchmark summary
        if: always()
        run: |
          {
            echo "## ⚡ Benchmark Results"
            echo ""
            if [ -f benchmarks/latest.json ]; then
              node -e "
                const d = require('./benchmarks/latest.json');
                const files = d.testResults.filter(f => f.assertionResults.some(a => a.benchmarks.length)).length;
                const groups = new Set(d.testResults.flatMap(f =>
                  f.assertionResults.filter(a => a.benchmarks.length).map(a =>
                    JSON.stringify([f.name, a.ancestorTitles])))).size;
                const benches = d.testResults.reduce((s, f) => s + f.assertionResults.reduce((n, a) =>
                  n + a.benchmarks.reduce((g, b) => g + b.tasks.filter(t => !t.fromStore).length, 0), 0), 0);
                console.log('| Metric | Count |');
                console.log('|--------|------:|');
                console.log('| Benchmark files | ' + files + ' |');
                console.log('| Benchmark groups | ' + groups + ' |');
                console.log('| Total benchmarks | ' + benches + ' |');
              "
              echo ""
              echo "Compared against committed \`benchmarks/baseline.json\`."
              echo "To update the baseline: \`npm run bench:save\` and commit."
            else
              echo "⚠️ No benchmark output generated"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # Informational (plan P7.2a): times the dotnet commands the extension runs; docs/perf-baseline.md cites one run.
  # No npm ci (the script uses Node built-ins only) and no warm-up: the SDK probe row is the job's first dotnet call.
  perf:
    name: Perf baseline (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Measure
        run: node scripts/perf-baseline.mjs --out "$RUNNER_TEMP/perf-baseline.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-baseline
          path: ${{ runner.temp }}/perf-baseline.json
          if-no-files-found: ignore
